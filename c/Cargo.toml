[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "rspack-lightningcss-c-bindings"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "lightningcss_c_bindings"
crate-type = ["cdylib"]

[dependencies]
lightningcss = { workspace = true, features = ["browserslist"] }
parcel_sourcemap = { version = "2.1.1", features = ["json"] }
browserslist-rs = { version = "0.21.0" }

[build-dependencies]
cbindgen = "0.24.3"
