[package]
authors = ["Devon Govett <devongovett@gmail.com>"]
name = "rspack-lightningcss-node"
version.workspace = true
edition = "2021"
publish = false

[lib]
name = "lightningcss_node"
# The addon links against Node.js at runtime and has no Rust unit tests.
test = false
crate-type = ["cdylib"]

[dependencies]
rspack-lightningcss-napi = { workspace = true, features = [
  "bundler",
  "visitor",
] }
napi = { version = "2.15.4", default-features = false, features = [
  "compat-mode",
] }
napi-derive = "2"

[target.'cfg(target_os = "macos")'.dependencies]
jemallocator = { version = "0.3.2", features = ["disable_initial_exec_tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
napi-build = "1"
